name: Build and Push VSCode All-in-One

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'dockerfile-kasm-browsers-and-vscode'
      - 'src/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'dockerfile-kasm-browsers-and-vscode'
      - 'src/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom tag for the image'
        required: false
        default: 'latest'

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/vscode-allinone

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Extract metadata for basic tag
      id: meta-basic
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch,suffix=-basic
          type=ref,event=pr,suffix=-basic
          type=sha,prefix={{branch}}-basic-
          type=raw,value=basic,enable={{is_default_branch}}
          type=raw,value=${{ github.event.inputs.tag }}-basic,enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

    - name: Extract metadata for full tag
      id: meta-full
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch,suffix=-full
          type=ref,event=pr,suffix=-full
          type=sha,prefix={{branch}}-full-
          type=raw,value=full,enable={{is_default_branch}}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=${{ github.event.inputs.tag }}-full,enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
          type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

    - name: Build and push Docker image with basic tag
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./dockerfile-kasm-browsers-and-vscode
        target: basic
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta-basic.outputs.tags }}
        labels: ${{ steps.meta-basic.outputs.labels }}
        build-args: |
          BASE_IMAGE=core-ubuntu-noble
          BASE_TAG=1.16.0
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Docker image with full tag
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./dockerfile-kasm-browsers-and-vscode
        target: full
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta-full.outputs.tags }}
        labels: ${{ steps.meta-full.outputs.labels }}
        build-args: |
          BASE_IMAGE=core-ubuntu-noble
          BASE_TAG=1.16.0
          NVM_VERSION=v0.40.3
          NODE_VERSION=22
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Output image information
      run: |
        echo "Docker image built and pushed successfully with tags:"
        echo "Basic tags: ${{ steps.meta-basic.outputs.tags }}"
        echo "Full tags: ${{ steps.meta-full.outputs.tags }}"
